<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Le Tirageausaur 🦖</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Knewave&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at top left, #d9f99d 0, transparent 30%),
                radial-gradient(circle at bottom right, #bbf7d0 0, transparent 30%),
                #f4f7f2;
            color: #1f2937;
        }

        /* =========================
           DINOSAURE
        ========================= */

        #movingIcon {
            position: fixed;
            width: 90px;
            z-index: 10;
            top: 30px;
            left: 20px;
            animation: dinoMove 10s linear infinite alternate;
            pointer-events: none;
        }

        @keyframes dinoMove {

            0% {
                transform: translateX(0) rotate(-5deg);
            }

            100% {
                transform: translateX(calc(100vw - 140px)) rotate(5deg);
            }
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            width: min(1000px, 94%);
            margin: auto;
            padding: 90px 0 60px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-family: "Knewave", cursive;
            font-size: clamp(42px, 8vw, 78px);
            margin: 0;

            color: #166534;

            text-shadow:
                3px 3px 0 #bef264,
                6px 6px 0 rgba(0,0,0,.08);
        }

        .subtitle {
            margin-top: 10px;
            font-size: 17px;
            color: #64748b;
        }

        /* =========================
           CARTE PRINCIPALE
        ========================= */

        .main-card {

            background: rgba(255,255,255,.92);

            border-radius: 28px;

            padding: 30px;

            box-shadow:
                0 20px 50px rgba(0,0,0,.08);

            border:
                1px solid rgba(255,255,255,.8);

            backdrop-filter: blur(8px);
        }

        /* =========================
           TITRE LISTE
        ========================= */

        .participants-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 12px;
        }

        .participants-header strong {
            font-size: 16px;
        }

        #participantCount {

            background: #dcfce7;

            color: #166534;

            padding: 7px 12px;

            border-radius: 30px;

            font-weight: 700;

            font-size: 14px;
        }

        /* =========================
           TEXTAREA
        ========================= */

        textarea {

            width: 100%;

            min-height: 220px;

            resize: vertical;

            border: 2px solid #e2e8f0;

            border-radius: 18px;

            padding: 18px;

            font-family: inherit;

            font-size: 16px;

            outline: none;

            transition: .25s;

            background: #fafafa;
        }

        textarea:focus {

            border-color: #22c55e;

            background: white;

            box-shadow:
                0 0 0 4px rgba(34,197,94,.12);
        }

        /* =========================
           OPTIONS
        ========================= */

        .options {

            display: flex;

            flex-wrap: wrap;

            gap: 15px;

            margin-top: 20px;

            align-items: center;

            justify-content: space-between;
        }

        .toggle-option {

            display: flex;

            align-items: center;

            gap: 12px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            user-select: none;
        }

        .toggle-option input {
            display: none;
        }

        .toggle {

            width: 48px;

            height: 27px;

            border-radius: 30px;

            background: #cbd5e1;

            position: relative;

            transition: .25s;
        }

        .toggle::after {

            content: "";

            position: absolute;

            width: 21px;

            height: 21px;

            background: white;

            border-radius: 50%;

            top: 3px;

            left: 3px;

            box-shadow:
                0 2px 5px rgba(0,0,0,.2);

            transition: .25s;
        }

        .toggle-option input:checked + .toggle {

            background: #22c55e;
        }

        .toggle-option input:checked + .toggle::after {

            left: 24px;
        }

        /* =========================
           BOUTON
        ========================= */

        #drawButton {

            width: 100%;

            margin-top: 28px;

            border: none;

            border-radius: 18px;

            padding: 18px;

            font-size: 18px;

            font-weight: 800;

            cursor: pointer;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #65a30d
                );

            box-shadow:
                0 10px 25px rgba(22,163,74,.28);

            transition:
                transform .15s,
                box-shadow .15s;
        }

        #drawButton:hover {

            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(22,163,74,.35);
        }

        #drawButton:active {

            transform: scale(.98);
        }

        /* =========================
           RESULTAT
        ========================= */

        #winner {

            margin-top: 30px;

            min-height: 150px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #ecfccb,
                    #dcfce7
                );

            border:
                2px dashed #84cc16;

            padding: 25px;

            transition: .3s;
        }

        #winner .small {

            font-size: 14px;

            color: #64748b;

            text-transform: uppercase;

            letter-spacing: 1px;

            font-weight: 700;
        }

        #winner .name {

            font-family: "Knewave", cursive;

            font-size: clamp(35px, 6vw, 60px);

            color: #166534;

            margin-top: 8px;
        }

        #winner.draw-animation {

            transform: scale(1.03);

            box-shadow:
                0 15px 40px rgba(34,197,94,.18);
        }

        /* =========================
           BAS DE PAGE
        ========================= */

        .dashboard {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 22px;

            margin-top: 25px;
        }

        .panel {

            background: white;

            border-radius: 22px;

            padding: 22px;

            box-shadow:
                0 8px 25px rgba(0,0,0,.06);
        }

        .panel h2 {

            font-size: 19px;

            margin:
                0 0 18px;

            color: #166534;
        }

        ul {

            padding: 0;

            margin: 0;

            list-style: none;
        }

        li {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding:
                11px 5px;

            border-bottom:
                1px solid #f1f5f9;

            font-size: 14px;
        }

        li:last-child {
            border-bottom: none;
        }

        .score {

            font-weight: 800;

            background: #ecfccb;

            color: #365314;

            padding: 4px 9px;

            border-radius: 15px;
        }

        /* =========================
           BOUTON RESET
        ========================= */

        #resetButton {

            margin-top: 20px;

            border: none;

            background: transparent;

            color: #64748b;

            font-size: 13px;

            cursor: pointer;

            text-decoration: underline;
        }

        /* =========================
           CANVAS
        ========================= */

        #fireworksCanvas {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            pointer-events: none;

            z-index: 999;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .page {

                width: 92%;

                padding-top: 85px;
            }

            .main-card {

                padding: 20px;
            }

            .dashboard {

                grid-template-columns: 1fr;
            }

            #movingIcon {

                width: 65px;
            }
        }

    </style>

</head>

<body>

<img
    src="dino.png"
    alt="Le Tirageausaur"
    id="movingIcon"
>

<canvas id="fireworksCanvas"></canvas>

<div class="page">

    <header>

        <h1>Le Tirageausaur</h1>

        <div class="subtitle">
            🦖 Le dinosaure qui décide à ta place.
        </div>

    </header>


    <div class="main-card">

        <div class="participants-header">

            <strong>
                👥 Participants
            </strong>

            <span id="participantCount">
                0 participant
            </span>

        </div>


        <textarea
            id="participantInput"
            placeholder="Collez ou écrivez les noms des participants...

Exemple :
Alice
Mikael
Seb
Lilou"
        ></textarea>


        <div class="options">

            <label class="toggle-option">

                <input
                    type="checkbox"
                    id="removeWinner"
                >

                <span class="toggle"></span>

                Retirer le nom après le tirage

            </label>

        </div>


        <button id="drawButton">

            <i class="fa-solid fa-dice"></i>

            Faire le Tirageausaur

        </button>


        <div id="winner">

            <span class="small">
                Le Tirageausaur attend ses victimes…
            </span>

            <span class="name">
                🦖
            </span>

        </div>


        <div style="text-align:center">

            <button id="resetButton">
                Réinitialiser l'historique et les scores
            </button>

        </div>

    </div>


    <div class="dashboard">


        <div class="panel">

            <h2>
                🕒 Historique des tirages
            </h2>

            <ul id="historyList">

                <li>
                    Aucun tirage pour le moment.
                </li>

            </ul>

        </div>


        <div class="panel">

            <h2>
                🏆 Scoreboard
            </h2>

            <ul id="scoreList">

                <li>
                    Aucun score.
                </li>

            </ul>

        </div>


    </div>

</div>


<!-- Confettis -->
<script
src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
</script>


<script>

/* ==========================================
   ELEMENTS
========================================== */

const participantInput =
    document.getElementById("participantInput");

const drawButton =
    document.getElementById("drawButton");

const winnerBox =
    document.getElementById("winner");

const participantCount =
    document.getElementById("participantCount");

const removeWinner =
    document.getElementById("removeWinner");

const historyList =
    document.getElementById("historyList");

const scoreList =
    document.getElementById("scoreList");

const resetButton =
    document.getElementById("resetButton");


/* ==========================================
   DONNEES
========================================== */

let history = [];

let scores = {};


/* ==========================================
   RECUPERER LES PARTICIPANTS
========================================== */

function getParticipants() {

    return participantInput.value

        .split("\n")

        .map(name => name.trim())

        .filter(name => name !== "");

}


/* ==========================================
   COMPTEUR
========================================== */

function updateParticipantCount() {

    const participants =
        getParticipants();

    const number =
        participants.length;

    participantCount.textContent =
        number +
        (number > 1
            ? " participants"
            : " participant");
}


/* ==========================================
   TIRAGE
========================================== */

function drawParticipant() {

    let participants =
        getParticipants();


    if (participants.length === 0) {

        winnerBox.innerHTML = `

            <span class="small">
                Oups…
            </span>

            <span class="name">
                Aucun nom 🦖
            </span>

        `;

        return;
    }


    /* animation faux tirage */

    drawButton.disabled = true;

    let animationCount = 0;


    const animation =
        setInterval(() => {

            const temporaryName =
                participants[
                    Math.floor(
                        Math.random()
                        *
                        participants.length
                    )
                ];


            winnerBox.innerHTML = `

                <span class="small">
                    Le Tirageausaur réfléchit…
                </span>

                <span class="name">
                    ${escapeHTML(temporaryName)}
                </span>

            `;


            animationCount++;


            if (animationCount >= 12) {

                clearInterval(animation);

                chooseFinalParticipant(participants);

            }

        }, 90);

}


/* ==========================================
   RESULTAT FINAL
========================================== */

function chooseFinalParticipant(participants) {

    const winnerIndex =
        Math.floor(
            Math.random()
            *
            participants.length
        );

    const winner =
        participants[winnerIndex];


    winnerBox.innerHTML = `

        <span class="small">
            🦖 Le Tirageausaur a choisi
        </span>

        <span class="name">
            ${escapeHTML(winner)}
        </span>

        <div style="
            margin-top:8px;
            font-size:14px;
            color:#64748b;
        ">
            Tu as été dévoré par le Tirageausaur !
        </div>

    `;


    winnerBox.classList.add(
        "draw-animation"
    );


    setTimeout(
        () =>
            winnerBox.classList.remove(
                "draw-animation"
            ),
        500
    );


    /* HISTORIQUE */

    history.unshift({

        name: winner,

        date:
            new Date()
                .toLocaleTimeString(
                    "fr-FR",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                )

    });


    /* SCORE */

    if (!scores[winner]) {

        scores[winner] = 0;

    }

    scores[winner]++;


    /* RETIRER LE NOM */

    if (removeWinner.checked) {

        participants.splice(
            winnerIndex,
            1
        );


        participantInput.value =
            participants.join("\n");

    }


    updateParticipantCount();

    updateHistory();

    updateScoreboard();

    launchConfetti();


    drawButton.disabled = false;

}


/* ==========================================
   HISTORIQUE
========================================== */

function updateHistory() {

    historyList.innerHTML = "";


    if (history.length === 0) {

        historyList.innerHTML = `

            <li>
                Aucun tirage pour le moment.
            </li>

        `;

        return;
    }


    history.forEach(item => {

        const li =
            document.createElement("li");


        li.innerHTML = `

            <span>
                🦖 ${escapeHTML(item.name)}
            </span>

            <small>
                ${item.date}
            </small>

        `;


        historyList.appendChild(li);

    });

}


/* ==========================================
   SCOREBOARD
========================================== */

function updateScoreboard() {

    scoreList.innerHTML = "";


    const ranking =
        Object.entries(scores)

            .sort(
                (a, b) =>
                    b[1] - a[1]
            );


    if (ranking.length === 0) {

        scoreList.innerHTML = `

            <li>
                Aucun score.
            </li>

        `;

        return;
    }


    ranking.forEach(
        ([name, score], index) => {

            const li =
                document.createElement("li");


            let medal = "";

            if (index === 0)
                medal = "🥇";

            else if (index === 1)
                medal = "🥈";

            else if (index === 2)
                medal = "🥉";

            else
                medal = "🦖";


            li.innerHTML = `

                <span>

                    ${medal}

                    ${escapeHTML(name)}

                </span>

                <span class="score">

                    ${score}

                </span>

            `;


            scoreList.appendChild(li);

        }
    );

}


/* ==========================================
   CONFETTIS
========================================== */

function launchConfetti() {

    confetti({

        particleCount: 120,

        spread: 75,

        origin: {
            y: .65
        }

    });


    setTimeout(() => {

        confetti({

            particleCount: 80,

            angle: 60,

            spread: 55,

            origin: {
                x: 0
            }

        });

        confetti({

            particleCount: 80,

            angle: 120,

            spread: 55,

            origin: {
                x: 1
            }

        });

    }, 200);

}


/* ==========================================
   RESET
========================================== */

resetButton.addEventListener(
    "click",
    () => {

        history = [];

        scores = {};

        updateHistory();

        updateScoreboard();


        winnerBox.innerHTML = `

            <span class="small">

                Le Tirageausaur attend ses victimes…

            </span>

            <span class="name">

                🦖

            </span>

        `;

    }
);


/* ==========================================
   SECURITE HTML
========================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ==========================================
   EVENTS
========================================== */

participantInput.addEventListener(
    "input",
    updateParticipantCount
);


drawButton.addEventListener(
    "click",
    drawParticipant
);


updateParticipantCount();

</script>

</body>
</html>
